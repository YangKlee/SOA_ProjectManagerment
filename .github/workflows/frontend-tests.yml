name: Frontend checks

on:
  push:
    paths:
      - 'fe/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'fe/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
