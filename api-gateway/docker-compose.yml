services:
  api-gateway:
    build: .
    image: soa-api-gateway:local
    container_name: soa-api-gateway
    ports:
      - "8000:80"
    environment:
      CONSUL_URL: ${CONSUL_URL:-http://host.docker.internal:8500}
      CONSUL_TOKEN: ${CONSUL_TOKEN:-}
      CONSUL_REFRESH_SECONDS: ${CONSUL_REFRESH_SECONDS:-3}
      CONSUL_TIMEOUT_SECONDS: ${CONSUL_TIMEOUT_SECONDS:-2}
      CONSUL_STALE_TTL_SECONDS: ${CONSUL_STALE_TTL_SECONDS:-15}
    restart: unless-stopped
