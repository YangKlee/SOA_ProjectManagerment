worker_processes auto;
pid /var/run/nginx.pid;
events {}
http {
log_format safe '$request_id $request_method $uri $status';
access_log /dev/stdout safe;
error_log /dev/stderr warn;
map_hash_bucket_size 512;
map $http_origin $cors_origin {
default "";
"http://127.0.0.1:5173" "http://127.0.0.1:5173";
"http://localhost:5173" "http://localhost:5173";
}
map $http_origin $cors_requested {
"" 0;
default 1;
}
map "$request_method:$cors_requested:$cors_origin" $cors_preflight {
default 0;
"OPTIONS:1:" 2;
~^OPTIONS:1:.+ 1;
}
map $cors_preflight $cors_methods {
default "";
1 "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS";
}
map $cors_preflight $cors_headers {
default "";
1 "Authorization, Content-Type, Accept, X-Request-ID";
}
map $cors_preflight $cors_max_age {
default "";
1 "600";
}
server {
listen 80;
server_name _;
default_type application/json;
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Vary "Origin" always;
add_header Access-Control-Allow-Methods $cors_methods always;
add_header Access-Control-Allow-Headers $cors_headers always;
add_header Access-Control-Max-Age $cors_max_age always;
location = /health/ { return 200 '{"status":"ok","service":"api-gateway"}'; }
error_page 502 504 =503 @unavailable;
location @unavailable { return 503 '{"detail":"Service unavailable."}'; }
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
location /auth/ {
if ($cors_preflight = 2) { return 403; }
if ($cors_preflight = 1) { return 204; }
return 503 '{"detail":"Service unavailable."}';
}
location /academic/ {
if ($cors_preflight = 2) { return 403; }
if ($cors_preflight = 1) { return 204; }
return 503 '{"detail":"Service unavailable."}';
}
location /registrations/ {
if ($cors_preflight = 2) { return 403; }
if ($cors_preflight = 1) { return 204; }
return 503 '{"detail":"Service unavailable."}';
}
location /topics/ {
if ($cors_preflight = 2) { return 403; }
if ($cors_preflight = 1) { return 204; }
return 503 '{"detail":"Service unavailable."}';
}
location / { return 404 '{"detail":"Not found."}'; }
}
}
