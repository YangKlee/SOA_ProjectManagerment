events {}

http {
    server {
        listen 80;
        server_name _;

        # Health check for the gateway itself (no authentication required).
        location = /health/ {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # auth-service: http://localhost:8000/login/
        # Example public URL: http://localhost:8080/auth/login/
        location /auth/ {
            proxy_pass http://host.docker.internal:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # academic-service: http://localhost:8001/
        # Example public URL: http://localhost:8080/academic/students/
        location /academic/ {
            proxy_pass http://host.docker.internal:8001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # regist-service: http://localhost:8002/
        # Example public URL: http://localhost:8080/registrations/
        location /registrations/ {
            proxy_pass http://host.docker.internal:8002/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
